<title>ChatGPT UI</title>

<style>
:root{--background:#fcfcfc;--surface:#ffffff;--text:#171717;--muted:#929292;--faint:#bcbcbc;--border:#e3e3e3;--hover:#eeeeee;--blue:#3983ff;--pink:#ed4f9b;--pink-surface:#f9eff5;--voice:#ef70b1;--avatar:#b9944e;--shadow:0 2px 12px #00000005;--font:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--font);color:var(--text);background:var(--background);font-size:14px}button,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:hover{background:var(--hover)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.symbols{position:absolute;width:0;height:0;overflow:hidden}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:341px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--background);transition:margin-left .2s}.sidebar.hidden{margin-left:-341px}.sidebar-top{height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}.brand{font-size:18px;font-weight:600;flex:1}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;padding:4px}.subtle{color:var(--muted)}.new-chat{display:flex;align-items:center;gap:8px;height:48px;width:100%;padding:0 16px;text-align:left;border-radius:0}.new-chat svg{width:18px;height:18px}.projects{height:37px;border-top:1px solid var(--border);padding:5px 16px;color:var(--faint)}.recent{color:var(--muted);padding:24px 16px 10px}.history-empty{flex:1}.account{display:flex;align-items:center;height:61px;padding:0 6px 0 14px;gap:8px}.avatar{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--avatar);color:var(--surface);font-size:10px}.account-info{flex:1;line-height:18px;font-size:12px}.account-name{font-weight:600;font-size:14px}.account-upgrade{border:1px solid #d6d6d6;border-radius:18px;padding:5px 10px;background:var(--surface);white-space:nowrap}.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 14px}.upgrade{display:flex;align-items:center;gap:4px;color:var(--blue);padding:3px;border-radius:5px;font-size:14px}.upgrade svg{fill:currentColor;stroke:none;width:21px;height:21px}.close-upgrade{font-size:18px;color:var(--muted);width:24px}.share{display:flex;align-items:center;gap:7px;padding:4px;border-radius:5px}.share svg{width:17px;height:17px}.toolbar .options{margin-left:3px}.restore-sidebar{margin-right:auto;display:none}.sidebar.hidden+.main .restore-sidebar{display:inline-flex}.workspace{flex:1;min-height:0}.composer-area{width:min(768px,calc(100% - 48px));margin:0 auto 22px}.disclaimer{text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px;line-height:18px}.composer{min-height:54px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid #ebebeb;border-radius:30px;padding:7px 8px 7px 12px;box-shadow:var(--shadow)}.add{width:30px;height:32px}.add svg{width:23px;height:23px;stroke-width:1.7}.composer textarea{flex:1;min-width:0;height:30px;max-height:120px;resize:none;outline:none;border:0;background:none;color:var(--text);padding:5px 0;font-size:16px;line-height:20px}.composer textarea::placeholder{color:var(--muted)}.think{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:91px;background:var(--pink-surface);color:var(--pink);border-radius:20px;font-size:16px;padding:0 12px}.think:hover{background:var(--pink-surface)}.think[aria-pressed="false"]{background:transparent;color:var(--muted)}.think svg{width:19px;height:19px}.mic{height:34px;width:26px;padding:3px}.mic svg{width:20px;height:20px}.voice{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--voice);color:var(--surface);flex-shrink:0}.voice:hover{background:var(--pink)}.voice svg{width:22px;height:22px;stroke-width:1.8}.mobile-brand{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1600px){.composer-area{width:768px}}@media(max-width:800px){.sidebar{width:260px}.sidebar.hidden{margin-left:-260px}.toolbar{gap:10px}.composer-area{width:calc(100% - 28px);margin-bottom:16px}.composer{gap:5px}.think{min-width:76px;padding:0 9px}.composer textarea{font-size:14px}}@media(max-width:600px){.sidebar{display:none}.toolbar{height:52px;gap:9px;padding:0 12px}.mobile-brand{display:block;margin-right:auto;font-size:18px;font-weight:600}.toolbar .share span{display:none}.close-upgrade{display:none}.toolbar .options{margin:0}.upgrade{font-size:12px}.sidebar.hidden+.main .restore-sidebar{display:none}.disclaimer{font-size:10px}.composer-area{width:calc(100% - 24px);margin-bottom:14px}.think{min-width:0;font-size:14px;padding:0 9px}.think svg{width:16px}.composer textarea{font-size:14px}}@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}

/* 기능 추가용 스타일: 기존 UI 규칙은 변경하지 않고 새 화면에만 적용 */
.ui-hidden{display:none!important}
.history-list{padding:0 8px 10px;overflow:auto;max-height:46%;}
.history-item{display:flex;align-items:center;gap:4px;padding:1px 4px;border-radius:9px;}
.history-open{min-width:0;flex:1;text-align:left;padding:10px 8px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;}
.history-item.active{background:var(--hover)}
.history-delete{flex-shrink:0;width:26px;height:26px;border-radius:6px;color:var(--muted);font-size:18px;}
.conversation-view{width:100%;height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;min-height:0;}
.conversation-heading{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;}
.conversation-subtitle{color:var(--muted);font-size:12px;font-weight:400;margin-top:3px;}
.message-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:17px;padding:20px 24px;scroll-behavior:smooth;}
.message-row{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;}
.message-row.mine{align-items:flex-end;}
.message-bubble{max-width:min(78%,640px);padding:11px 14px;border:1px solid var(--border);border-radius:17px;background:var(--surface);line-height:1.55;overflow-wrap:anywhere;white-space:normal;}
.message-row.mine .message-bubble{background:#f4f4f4;border-color:#eeeeee;}
.message-body{white-space:normal;}
.message-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:5px 2px 0;}
.message-actions{display:flex;align-items:center;gap:3px;margin:5px 0 0;}
.message-action{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:3px 7px;border-radius:7px;color:var(--muted);font-size:12px;}
.message-action:hover{background:var(--hover);color:var(--text);}
.message-action.liked{color:#d94384;background:var(--pink-surface);}
.read-state{font-size:11px;color:var(--muted);margin-left:2px;}
.reply-quote{border-left:3px solid var(--pink);padding:5px 9px;margin-bottom:8px;background:#f9eff5;border-radius:0 7px 7px 0;font-size:12px;color:#555;max-width:100%;overflow:hidden;}
.reply-quote strong{display:block;margin-bottom:2px;font-size:11px;color:var(--pink);}
.empty-chat{margin:auto;text-align:center;color:var(--muted);padding:28px;line-height:1.7;}
.reply-composer{display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:9px 12px;border-left:3px solid var(--pink);background:var(--pink-surface);border-radius:8px;}
.reply-composer-copy{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555;font-size:12px;}
.reply-composer-copy strong{display:block;color:var(--pink);font-size:11px;margin-bottom:2px;}
.reply-cancel{width:25px;height:25px;border-radius:6px;color:var(--muted);font-size:18px;}
.auth-layer,.modal-layer{position:fixed;inset:0;z-index:30;background:var(--background);display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:var(--shadow);}
.auth-logo{font-size:21px;font-weight:600;text-align:center;margin-bottom:10px;}
.auth-heading{font-size:21px;font-weight:600;text-align:center;margin:0 0 7px;}
.auth-description{text-align:center;color:var(--muted);line-height:1.6;margin:0 0 24px;font-size:13px;}
.auth-form{display:flex;flex-direction:column;gap:13px;}
.auth-field{display:flex;flex-direction:column;gap:6px;font-size:13px;}
.auth-field input,.friend-search{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);color:var(--text);outline:none;font:inherit;}
.auth-field input:focus,.friend-search:focus{border-color:#a8a8a8;}
.auth-submit{width:100%;padding:12px;border-radius:10px;background:#171717;color:white;font-weight:600;margin-top:5px;}
.auth-submit:hover{background:#333;}
.auth-switch{text-align:center;margin:18px 0 0;color:var(--muted);font-size:13px;}
.text-button{color:var(--blue);padding:4px 5px;border-radius:5px;}
.auth-error{color:#c4315f;font-size:12px;line-height:1.5;min-height:16px;}
.modal-layer{background:#00000038;z-index:25;}
.modal-card{width:min(500px,100%);max-height:min(680px,85dvh);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 45px #00000018;overflow:hidden;}
.modal-heading{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px;}
.modal-close{width:28px;height:28px;border-radius:7px;font-size:21px;color:var(--muted);}
.friend-search-wrap{padding:14px 16px 8px;}
.friend-list{overflow:auto;min-height:100px;padding:0 10px 12px;}
.friend-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 9px;text-align:left;border-radius:9px;}
.friend-row:hover{background:var(--hover);}
.friend-avatar{width:34px;height:34px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eee3d3;color:#6f552d;font-size:12px;font-weight:600;}
.friend-info{min-width:0;flex:1;}
.friend-name{font-size:14px;font-weight:600;}
.friend-hint{font-size:12px;color:var(--muted);margin-top:3px;}
.friend-empty{padding:28px 14px;text-align:center;color:var(--muted);line-height:1.7;font-size:13px;}
.account-menu{position:absolute;right:12px;top:46px;z-index:15;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 30px #00000012;border-radius:10px;padding:6px;width:150px;}
.account-menu button{width:100%;text-align:left;padding:9px 10px;border-radius:7px;}
.app-toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:60;max-width:min(92vw,540px);padding:10px 14px;background:#242424;color:white;border-radius:10px;box-shadow:0 5px 20px #00000020;font-size:13px;line-height:1.4;}
.message-send-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:7px;}
@media(max-width:600px){.message-list{padding:16px 12px;gap:14px}.message-bubble{max-width:88%;padding:10px 12px}.conversation-heading{padding:11px 14px}.auth-card{padding:24px 20px}.history-list{max-height:42%;}.reply-composer{margin:0 2px 7px}.message-action{padding:3px 5px}.modal-layer{padding:12px}.modal-card{max-height:88dvh}}
@media(prefers-color-scheme:dark){/* OS 테마와 무관하게 원본 밝은 UI를 유지 */}
.conversation-unread{background:var(--pink-surface);color:var(--pink);font-size:10px;border-radius:10px;padding:2px 5px;white-space:nowrap;}
</style>

<style>
/* New-chat layout and file picker menu */
.home-screen{position:absolute;left:0;right:0;top:calc(50% - 149px);display:flex;justify-content:center;pointer-events:none;padding:0 18px;}
.home-title{margin:0;font-size:25px;font-weight:500;letter-spacing:-.6px;text-align:center;color:var(--text);}
.main.home-mode .workspace{position:relative;}
.main.home-mode .conversation-view{display:none!important;}
.main.home-mode .composer-area{position:absolute;z-index:5;left:50%;top:calc(50% - 85px);transform:translateX(-50%);width:min(768px,calc(100% - 48px));margin:0;}
.main.home-mode .composer-wrap{position:relative;}
.composer-wrap{position:relative;}
.main.home-mode .composer{min-height:54px;}
.home-suggestions{display:none;align-items:center;flex-direction:column;gap:8px;width:min(768px,100%);margin:24px auto 0;}
.main.home-mode .home-suggestions{display:flex;}
.home-suggestion{display:flex;align-items:center;gap:14px;width:min(320px,100%);padding:8px 12px;border-radius:10px;text-align:left;color:#888;}
.home-suggestion svg{width:18px;height:18px;}
.home-suggestion:hover{background:var(--hover);color:var(--text);}
.plus-menu{position:absolute;left:0;bottom:calc(100% + 10px);z-index:20;width:min(100%,690px);max-height:min(70dvh,430px);overflow:auto;padding:12px 8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:23px;box-shadow:0 10px 35px #00000012;}
.plus-menu-label{font-size:13px;color:var(--muted);padding:0 8px 6px;}
.plus-menu-label.plugins-label{padding-top:11px;}
.plus-menu-option{width:100%;display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 9px;text-align:left;border-radius:11px;color:var(--text);}
.plus-menu-option:hover{background:var(--hover);}
.plus-menu-option .menu-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#8e8e8e;flex-shrink:0;}
.plus-menu-option .menu-icon svg{width:20px;height:20px;}
.plus-menu-option .menu-copy{display:flex;align-items:center;gap:13px;flex-wrap:wrap;min-width:0;}
.plus-menu-option .menu-main{font-size:14px;white-space:nowrap;}
.plus-menu-option .menu-sub{font-size:13px;color:var(--muted);}
.plus-menu-option .menu-main.korean-heavy{font-weight:500;}
.menu-color-image{color:#2db9d8!important;}
.menu-color-sketch{color:#10bca5!important;}
.menu-color-web{color:#20b6e8!important;}
.menu-color-research{color:#3983ff!important;}
.menu-color-thinking{color:#171717!important;}
.menu-divider{height:1px;background:#f0f0f0;margin:7px 8px 1px;}
.attachment-preview{display:none;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:12px 12px 4px;border:1px solid #ebebeb;border-bottom:0;border-radius:25px 25px 0 0;background:var(--surface);}
.attachment-preview.has-files{display:flex;}
.composer-area.has-attachments .composer{border-top:0;border-radius:0 0 25px 25px;}
.attachment-card{position:relative;width:122px;height:122px;border:1px solid var(--border);border-radius:15px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.attachment-card img{width:100%;height:100%;object-fit:cover;display:block;}
.attachment-card.file-card{height:82px;width:190px;justify-content:flex-start;gap:9px;padding:11px 33px 11px 10px;background:#fafafa;}
.attachment-file-icon{width:30px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#e9e9e9;color:#666;flex-shrink:0;}
.attachment-file-icon svg{width:19px;height:19px;}
.attachment-file-text{min-width:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;}
.attachment-file-name{font-size:12px;color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px;}
.attachment-file-size{font-size:11px;color:var(--muted);}
.attachment-remove{position:absolute;right:5px;top:5px;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222c;color:#fff;font-size:17px;line-height:1;}
.file-menu-button{cursor:pointer;}
.message-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;max-width:min(100%,550px);}
.message-attachment-image{display:block;width:190px;height:150px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
.message-attachment-image img{display:block;width:100%;height:100%;object-fit:cover;}
.message-attachment-file{display:flex;align-items:center;gap:9px;max-width:250px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--text);}
.message-attachment-file:hover{background:var(--hover);}
.message-attachment-file .attachment-file-name{max-width:175px;font-size:12px;}
.message-row.mine .message-attachment-file{background:#f4f4f4;}
.composer-area.has-attachments .plus-menu{bottom:calc(100% + 10px);}
@media(max-width:800px){.main.home-mode .composer-area{width:calc(100% - 28px);}.home-title{font-size:23px}.plus-menu{max-height:65dvh}.attachment-card{width:96px;height:96px}.attachment-card.file-card{width:170px;height:78px}}
@media(max-width:600px){.main.home-mode .composer-area{width:calc(100% - 24px);top:calc(50% - 62px);}.home-screen{top:calc(50% - 145px);}.home-title{font-size:21px}.home-suggestions{align-items:stretch;margin-top:17px;gap:4px}.home-suggestion{width:100%;padding:7px 8px}.plus-menu{width:100%;padding:10px 7px;border-radius:19px}.plus-menu-option .menu-copy{gap:7px}.plus-menu-option .menu-sub{font-size:12px}.attachment-card{width:82px;height:82px}.attachment-card.file-card{width:150px;height:72px;padding-left:7px}.attachment-file-name{max-width:92px}.message-attachment-image{width:155px;height:125px}}
</style>

<script>
const sidebar=document.querySelector('.sidebar');
document.getElementById('hide-sidebar').onclick=()=>sidebar.classList.add('hidden');
document.getElementById('show-sidebar').onclick=()=>sidebar.classList.remove('hidden');
const message=document.getElementById('message');
document.getElementById('think').onclick=(event)=>event.preventDefault();
const plusButton=document.getElementById('add-file');
const plusMenu=document.getElementById('plus-menu');
const fileInput=document.getElementById('file-input');
const attachmentPreview=document.getElementById('attachment-preview');
const composerArea=document.getElementById('composer-area');
const mainElement=document.querySelector('.main');
const homeScreen=document.getElementById('home-screen');
let pendingAttachments=[];
function setPlusMenu(open){plusMenu.classList.toggle('ui-hidden',!open);plusButton.setAttribute('aria-expanded',String(open));}
plusButton.onclick=()=>setPlusMenu(plusMenu.classList.contains('ui-hidden'));

document.addEventListener('click',(event)=>{if(!event.target.closest('#composer-wrap'))setPlusMenu(false);});
document.querySelector('.close-upgrade').onclick=(event)=>event.preventDefault();
document.querySelectorAll('[data-inert]').forEach(button=>button.addEventListener('click',event=>event.preventDefault()));
document.getElementById('mic-button').onclick=(event)=>event.preventDefault();
document.querySelector('.upgrade').onclick=(event)=>event.preventDefault();
document.querySelector('.share').onclick=(event)=>event.preventDefault();
document.querySelector('header .subtle').onclick=(event)=>event.preventDefault();

const $ = (selector) => document.querySelector(selector);
const authLayer = $('#auth-layer');
const authForm = $('#auth-form');
const authNameField = $('#auth-name-field');
const authModeSwitch = $('#auth-mode-switch');
const authSubmit = $('#auth-submit');
const authError = $('#auth-error');
const friendModal = $('#new-chat-modal');
const friendList = $('#friend-list');
const friendSearch = $('#friend-search');
const conversationList = $('#conversation-list');
const conversationView = $('#conversation-view');
const messageList = $('#message-list');
const replyComposer = $('#reply-composer');
const replyComposerCopy = $('#reply-composer-copy');
const sendButton = $('.voice');
const homeSuggestions = $('#home-suggestions');
let authMode = 'login';
let currentUser = null;
let activeConversationId = null;
let activeOtherUserId = null;
let activeOtherName = '';
let conversations = [];
let lastMessageSignature = '';
let replyTarget = null;
let friendSearchTimer = null;
let toastTimer = null;
let busySending = false;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function initials(name) {
  const chars = Array.from(String(name || '').trim());
  return escapeHtml(chars.slice(0, 2).join('').toUpperCase() || '?');
}
function prettyTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('ko-KR', {hour:'2-digit', minute:'2-digit'}).format(date);
}
function showToast(text) {
  let toast = $('#app-toast');
  if (!toast) {
    toast = document.createElement('div'); toast.id = 'app-toast'; toast.className = 'app-toast'; document.body.appendChild(toast);
  }
  toast.textContent = text;
  toast.classList.remove('ui-hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.add('ui-hidden'), 3200);
}
function formatBytes(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}
function safeImageType(type) { return ['image/png','image/jpeg','image/gif','image/webp'].includes(String(type || '').toLowerCase()); }
function renderAttachmentPreview() {
  attachmentPreview.innerHTML = '';
  const hasFiles = pendingAttachments.length > 0;
  attachmentPreview.classList.toggle('has-files', hasFiles);
  composerArea.classList.toggle('has-attachments', hasFiles);
  pendingAttachments.forEach((file, index) => {
    const card = document.createElement('div');
    card.className = 'attachment-card' + (safeImageType(file.type) ? '' : ' file-card');
    if (safeImageType(file.type)) {
      const img = document.createElement('img'); img.src = file.dataUrl; img.alt = file.name; card.appendChild(img);
    } else {
      card.innerHTML = `<span class="attachment-file-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 13h6M9 17h6"/></svg></span><span class="attachment-file-text"><span class="attachment-file-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span><span class="attachment-file-size">${formatBytes(file.size)}</span></span>`;
    }
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'attachment-remove'; remove.textContent = '×'; remove.title = '첨부 삭제'; remove.setAttribute('aria-label', `${file.name} 첨부 삭제`); remove.dataset.removeAttachment = String(index); card.appendChild(remove);
    attachmentPreview.appendChild(card);
  });
  updateSendControl();
}
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => typeof reader.result === 'string' ? resolve(reader.result) : reject(new Error('파일을 읽지 못했습니다.'));
    reader.onerror = () => reject(new Error(`${file.name} 파일을 읽지 못했습니다.`));
    reader.readAsDataURL(file);
  });
}
fileInput.addEventListener('change', async () => {
  const selected = Array.from(fileInput.files || []);
  fileInput.value = '';
  if (!selected.length) return;
  const remainingSlots = 5 - pendingAttachments.length;
  if (remainingSlots <= 0) { showToast('파일은 한 번에 최대 5개까지 첨부할 수 있습니다.'); return; }
  let total = pendingAttachments.reduce((sum, file) => sum + file.size, 0);
  for (const file of selected.slice(0, remainingSlots)) {
    if (file.size > 700 * 1024 || total + file.size > 700 * 1024) {
      showToast('첨부 파일은 전체 합계 700KB까지 지원합니다. 더 작은 파일을 선택해 주세요.');
      continue;
    }
    try {
      const dataUrl = await readFileAsDataUrl(file);
      pendingAttachments.push({ name: file.name.slice(0, 180), type: file.type || 'application/octet-stream', size: file.size, dataUrl });
      total += file.size;
    } catch (error) { showToast(error.message); }
  }
  if (selected.length > remainingSlots) showToast('파일은 최대 5개까지 첨부할 수 있습니다.');
  renderAttachmentPreview();
});
attachmentPreview.addEventListener('click', (event) => {
  const removeButton = event.target.closest('[data-remove-attachment]');
  if (!removeButton) return;
  pendingAttachments.splice(Number(removeButton.dataset.removeAttachment), 1);
  renderAttachmentPreview();
});
async function api(url, options = {}) {
  const requestOptions = { credentials: 'same-origin', cache: 'no-store', ...options, headers: {...(options.headers || {})} };
  if (options.body !== undefined && typeof options.body !== 'string') {
    requestOptions.headers['Content-Type'] = 'application/json';
    requestOptions.body = JSON.stringify(options.body);
  } else if (options.body !== undefined) {
    requestOptions.headers['Content-Type'] = 'application/json';
  }
  let response;
  try { response = await fetch(url, requestOptions); }
  catch { throw new Error('서버에 연결하지 못했습니다. Cloudflare Pages와 D1 설정을 확인하세요.'); }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `요청에 실패했습니다. (${response.status})`);
  return data;
}
function showAuthError(text) { authError.textContent = text || ''; }
function setAuthMode(mode) {
  authMode = mode;
  const signup = mode === 'register';
  $('#auth-heading').textContent = signup ? '계정 만들기' : '로그인';
  $('#auth-description').textContent = signup ? '이름과 이메일을 등록해 친구들과 대화하세요.' : '이름, 이메일, 비밀번호로 로그인하세요.';
  authNameField.classList.remove('ui-hidden');
  $('#auth-name').required = true;
  $('#auth-password').autocomplete = signup ? 'new-password' : 'current-password';
  authSubmit.textContent = signup ? '가입하기' : '로그인';
  authModeSwitch.innerHTML = signup
    ? '이미 계정이 있나요? <button class="text-button" type="button" id="switch-auth">로그인</button>'
    : '계정이 없나요? <button class="text-button" type="button" id="switch-auth">회원가입</button>';
  $('#switch-auth').onclick = () => { setAuthMode(signup ? 'login' : 'register'); showAuthError(''); };
  showAuthError('');
}
function showHomeScreen() {
  activeConversationId = null;
  activeOtherUserId = null;
  activeOtherName = '';
  replyTarget = null;
  conversationView.classList.add('ui-hidden');
  homeScreen.classList.remove('ui-hidden');
  mainElement.classList.add('home-mode');
  if (typeof message !== 'undefined' && message) message.value = '';
  if (typeof pendingAttachments !== 'undefined') { pendingAttachments = []; renderAttachmentPreview(); }
  if (replyComposer) replyComposer.classList.add('ui-hidden');
  setPlusMenu(false);
  if (message) { message.style.height = '30px'; updateSendControl(); }
}
function showSignedIn(user) {
  currentUser = user;
  authLayer.classList.add('ui-hidden');
  showHomeScreen();
  $('#current-name').textContent = user.name;
  $('#current-email').textContent = user.email;
  $('.avatar').textContent = initials(user.name);
  loadConversations();
}
function showSignedOut() {
  currentUser = null;
  showHomeScreen();
  activeConversationId = null;
  activeOtherUserId = null;
  activeOtherName = '';
  conversations = [];
  conversationList.innerHTML = '';
  conversationView.classList.add('ui-hidden');
  friendModal.classList.add('ui-hidden');
  $('#account-menu').classList.add('ui-hidden');
  authLayer.classList.remove('ui-hidden');
  setAuthMode('login');
}
authModeSwitch.innerHTML = '계정이 없나요? <button class="text-button" type="button" id="switch-auth">회원가입</button>';
$('#switch-auth').onclick = () => setAuthMode('register');

async function checkSession() {
  try {
    const data = await api('/api/auth/me');
    if (data.user) showSignedIn(data.user);
    else { authLayer.classList.remove('ui-hidden'); setAuthMode('login'); }
  } catch (error) {
    authLayer.classList.remove('ui-hidden');
    setAuthMode('login');
    showAuthError(error.message);
  }
}
authForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  authSubmit.disabled = true;
  authSubmit.textContent = authMode === 'register' ? '가입 중…' : '로그인 중…';
  showAuthError('');
  const payload = { name: $('#auth-name').value.trim(), email: $('#auth-email').value.trim(), password: $('#auth-password').value };
  try {
    const data = await api(`/api/auth/${authMode}`, { method: 'POST', body: payload });
    authForm.reset();
    showSignedIn(data.user);
    showToast(authMode === 'register' ? '가입되었습니다.' : '로그인되었습니다.');
  } catch (error) {
    showAuthError(error.message);
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = authMode === 'register' ? '가입하기' : '로그인';
  }
});

function renderConversations() {
  if (!conversations.length) {
    conversationList.innerHTML = '<div class="friend-empty" style="padding:12px 8px">아직 대화가 없습니다.<br>새 채팅에서 친구를 찾아보세요.</div>';
    return;
  }
  conversationList.innerHTML = conversations.map(item => {
    const title = escapeHtml(item.other_name);
    const preview = item.last_message_body ? escapeHtml(item.last_message_body) : '대화를 시작해 보세요';
    const isActive = item.id === activeConversationId ? ' active' : '';
    const unread = Number(item.unread_count || 0) > 0 ? `<span class="conversation-unread">${Math.min(Number(item.unread_count),99)}</span>` : '';
    return `<div class="history-item${isActive}" data-conversation-row="${escapeHtml(item.id)}"><button class="history-open" data-open-conversation="${escapeHtml(item.id)}" title="${title}"><span style="display:block;overflow:hidden;text-overflow:ellipsis">${title}</span><span style="display:block;color:var(--muted);font-size:11px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px">${preview}</span></button>${unread}<button class="history-delete" data-delete-conversation="${escapeHtml(item.id)}" title="내 대화 목록에서 삭제" aria-label="대화 삭제">×</button></div>`;
  }).join('');
}
async function loadConversations() {
  if (!currentUser) return;
  try {
    const data = await api('/api/conversations');
    conversations = data.conversations || [];
    renderConversations();
    if (activeConversationId) {
      const active = conversations.find(item => item.id === activeConversationId);
      if (active) {
        activeOtherName = active.other_name;
        $('#conversation-name').textContent = activeOtherName;
      }
    }
  } catch (error) { if (error.message.includes('로그인이 필요')) showSignedOut(); }
}
async function openConversation(id, otherName, otherUserId) {
  activeConversationId = id;
  mainElement.classList.remove('home-mode');
  homeScreen.classList.add('ui-hidden');
  activeOtherName = otherName || conversations.find(item => item.id === id)?.other_name || '대화';
  activeOtherUserId = otherUserId || conversations.find(item => item.id === id)?.other_user_id || null;
  $('#conversation-name').textContent = activeOtherName;
  conversationView.classList.remove('ui-hidden');
  lastMessageSignature = '';
  renderConversations();
  await loadMessages(true);
  if (window.matchMedia('(max-width: 600px)').matches) sidebar.classList.add('hidden');
  message.focus({preventScroll:true});
}
conversationList.addEventListener('click', async (event) => {
  const deleteButton = event.target.closest('[data-delete-conversation]');
  if (deleteButton) {
    event.stopPropagation();
    const id = deleteButton.dataset.deleteConversation;
    const target = conversations.find(item => item.id === id);
    if (!confirm(`'${target?.other_name || '이 대화'}' 대화를 내 목록에서 삭제할까요? 상대방의 대화 기록은 삭제되지 않습니다.`)) return;
    try {
      await api(`/api/conversations/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (activeConversationId === id) {
        showHomeScreen();
      }
      await loadConversations(); showToast('대화가 내 목록에서 삭제되었습니다.');
    } catch (error) { showToast(error.message); }
    return;
  }
  const openButton = event.target.closest('[data-open-conversation]');
  if (openButton) {
    const item = conversations.find(row => row.id === openButton.dataset.openConversation);
    if (item) await openConversation(item.id, item.other_name, item.other_user_id);
  }
});

function renderMessageAttachments(item) {
  const attachments = Array.isArray(item.attachments) ? item.attachments : [];
  if (!attachments.length) return '';
  return `<div class="message-attachments">${attachments.map((file, index) => {
    const url = `/api/messages/${encodeURIComponent(item.id)}/attachments/${index}`;
    const name = escapeHtml(file.name || '첨부 파일');
    if (safeImageType(file.type)) return `<a class="message-attachment-image" href="${url}" target="_blank" rel="noopener" aria-label="${name} 열기"><img src="${url}" alt="${name}" loading="lazy"></a>`;
    return `<a class="message-attachment-file" href="${url}" download><span class="attachment-file-icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 13h6M9 17h6"/></svg></span><span class="attachment-file-text"><span class="attachment-file-name" title="${name}">${name}</span><span class="attachment-file-size">${formatBytes(Number(file.size || 0))} · 다운로드</span></span></a>`;
  }).join('')}</div>`;
}
function renderMessages(items, keepScroll = false) {
  const nearBottom = messageList.scrollHeight - messageList.scrollTop - messageList.clientHeight < 100;
  if (!items.length) {
    messageList.innerHTML = '<div class="empty-chat">대화를 시작해 보세요.<br><span style="font-size:12px">첫 메시지를 보내면 여기에 표시됩니다.</span></div>';
    return;
  }
  messageList.innerHTML = items.map(item => {
    const mine = item.sender_id === currentUser.id;
    const liked = Number(item.liked) === 1;
    const reply = item.reply_body ? `<div class="reply-quote"><strong>${escapeHtml(item.reply_sender_id === currentUser.id ? '내 메시지에 답장' : '답장한 메시지')}</strong>${escapeHtml(item.reply_body)}</div>` : '';
    const readState = mine ? `<span class="read-state">${Number(item.is_read) === 1 ? '읽음' : '안읽음'}</span>` : '';
    const attachments = renderMessageAttachments(item);
    const visibleBody = (Array.isArray(item.attachments) && item.attachments.length && item.body === '첨부 파일') ? '' : escapeHtml(item.body).replace(/\n/g,'<br>');
    return `<article class="message-row ${mine ? 'mine' : ''}" data-message-row="${escapeHtml(item.id)}">
      <div class="message-bubble">${reply}${visibleBody ? `<div class="message-body">${visibleBody}</div>` : ''}${attachments}</div>
      <div class="message-meta"><span>${escapeHtml(mine ? '나' : item.sender_name)}</span><span>${prettyTime(item.created_at)}</span>${readState}</div>
      <div class="message-actions"><button class="message-action ${liked?'liked':''}" data-like-message="${escapeHtml(item.id)}" title="좋아요" aria-pressed="${liked}">👍 <span>${Number(item.like_count || 0) || ''}</span></button><button class="message-action" data-reply-message="${escapeHtml(item.id)}" title="답장">↩ <span>답장</span></button></div>
    </article>`;
  }).join('');
  if (!keepScroll || nearBottom) messageList.scrollTop = messageList.scrollHeight;
}
async function loadMessages(forceRender = false) {
  if (!currentUser || !activeConversationId) return;
  const id = activeConversationId;
  try {
    const data = await api(`/api/conversations/${encodeURIComponent(id)}/messages`);
    if (id !== activeConversationId) return;
    const items = data.messages || [];
    const signature = JSON.stringify(items.map(x => [x.id,x.like_count,x.liked,x.is_read,x.body,x.reply_body,x.attachments]));
    if (forceRender || signature !== lastMessageSignature) {
      renderMessages(items, !forceRender);
      lastMessageSignature = signature;
    }
    await loadConversations();
  } catch (error) { if (error.message.includes('로그인이 필요')) showSignedOut(); else console.warn(error); }
}

function setReply(item) {
  replyTarget = item;
  replyComposerCopy.innerHTML = `<strong>${escapeHtml(item.sender_id === currentUser.id ? '내 메시지에 답장' : item.sender_name + '님에게 답장')}</strong>${escapeHtml(item.body)}`;
  replyComposer.classList.remove('ui-hidden');
  message.focus();
}
$('#reply-cancel').onclick = () => { replyTarget = null; replyComposer.classList.add('ui-hidden'); };
messageList.addEventListener('click', async (event) => {
  const likeButton = event.target.closest('[data-like-message]');
  if (likeButton) {
    try {
      await api(`/api/messages/${encodeURIComponent(likeButton.dataset.likeMessage)}/like`, { method: 'POST', body: {} });
      await loadMessages(true);
    } catch (error) { showToast(error.message); }
    return;
  }
  const replyButton = event.target.closest('[data-reply-message]');
  if (replyButton) {
    try {
      const data = await api(`/api/conversations/${encodeURIComponent(activeConversationId)}/messages`);
      const item = (data.messages || []).find(row => row.id === replyButton.dataset.replyMessage);
      if (item) setReply(item);
    } catch (error) { showToast(error.message); }
  }
});
async function sendMessage() {
  const body = message.value.trim();
  if (!body && !pendingAttachments.length) return;
  if (!currentUser) return;
  if (!activeConversationId) {
    openFriendPicker();
    showToast('메시지를 보낼 친구를 선택하세요.');
    return;
  }
  if (busySending) return;
  if (body.length > 5000) { showToast('메시지는 5,000자 이하여야 합니다.'); return; }
  busySending = true;
  sendButton.disabled = true;
  try {
    const attachments = pendingAttachments.map(file => ({ name: file.name, type: file.type, size: file.size, dataUrl: file.dataUrl }));
    await api(`/api/conversations/${encodeURIComponent(activeConversationId)}/messages`, { method: 'POST', body: { body, replyTo: replyTarget?.id || null, attachments } });
    message.value = '';
    message.style.height = '30px';
    pendingAttachments = [];
    renderAttachmentPreview();
    replyTarget = null;
    replyComposer.classList.add('ui-hidden');
    updateSendControl();
    await loadMessages(true);
    await loadConversations();
  } catch (error) { showToast(error.message); }
  finally { busySending = false; sendButton.disabled = false; message.focus(); }
}
message.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); sendMessage(); }
});
message.addEventListener('input', () => {
  message.style.height = '30px';
  message.style.height = Math.min(message.scrollHeight, 120) + 'px';
  updateSendControl();
});
function updateSendControl() {
  const hasText = message.value.trim().length > 0 || pendingAttachments.length > 0;
  if (hasText) {
    sendButton.title = '메시지 보내기'; sendButton.setAttribute('aria-label','메시지 보내기');
    sendButton.innerHTML = '<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>';
  } else {
    sendButton.title = '음성 모드'; sendButton.setAttribute('aria-label','음성 모드');
    sendButton.innerHTML = '<svg><use href="#voice"/></svg>';
  }
}
sendButton.addEventListener('click', () => { if (message.value.trim() || pendingAttachments.length) sendMessage(); });

async function openFriendPicker() {
  if (!currentUser) return;
  setPlusMenu(false);
  friendModal.classList.remove('ui-hidden');
  friendSearch.value = '';
  friendList.innerHTML = '<div class="friend-empty">가입한 사용자를 불러오는 중…</div>';
  friendSearch.focus();
  await loadFriends('');
}
function openNewChat() {
  if (!currentUser) return;
  showHomeScreen();
  friendModal.classList.add('ui-hidden');
  renderConversations();
  message.focus({preventScroll:true});
}
$('#new-chat').onclick = openNewChat;
$('#modal-close').onclick = () => friendModal.classList.add('ui-hidden');
friendModal.addEventListener('click', event => { if (event.target === friendModal) friendModal.classList.add('ui-hidden'); });
friendSearch.addEventListener('input', () => {
  clearTimeout(friendSearchTimer);
  friendSearchTimer = setTimeout(() => loadFriends(friendSearch.value.trim()), 220);
});
async function loadFriends(query) {
  if (!currentUser || friendModal.classList.contains('ui-hidden')) return;
  try {
    const data = await api('/api/users' + (query ? `?q=${encodeURIComponent(query)}` : ''));
    const users = data.users || [];
    friendList.innerHTML = users.length ? users.map(user => `<button class="friend-row" data-start-chat="${escapeHtml(user.id)}" data-friend-name="${escapeHtml(user.name)}"><span class="friend-avatar">${initials(user.name)}</span><span class="friend-info"><span class="friend-name">${escapeHtml(user.name)}</span><span class="friend-hint">채팅 시작하기</span></span><span aria-hidden="true">›</span></button>`).join('') : `<div class="friend-empty">${query ? '검색 결과가 없습니다.' : '아직 가입한 다른 사용자가 없습니다.'}<br>친구도 회원가입을 완료해야 목록에 표시됩니다.</div>`;
  } catch (error) { friendList.innerHTML = `<div class="friend-empty">${escapeHtml(error.message)}</div>`; }
}
friendList.addEventListener('click', async event => {
  const button = event.target.closest('[data-start-chat]');
  if (!button) return;
  button.disabled = true;
  try {
    const data = await api('/api/conversations', { method: 'POST', body: { userId: button.dataset.startChat } });
    friendModal.classList.add('ui-hidden');
    await loadConversations();
    await openConversation(data.conversationId, button.dataset.friendName, button.dataset.startChat);
  } catch (error) { showToast(error.message); }
  finally { button.disabled = false; }
});

$('#account-menu-button').onclick = () => $('#account-menu').classList.toggle('ui-hidden');
document.addEventListener('click', event => {
  if (!event.target.closest('#account-menu') && !event.target.closest('#account-menu-button')) $('#account-menu').classList.add('ui-hidden');
});
$('#logout').onclick = async () => {
  try { await api('/api/auth/logout', { method: 'POST', body: {} }); }
  catch (error) { showToast(error.message); return; }
  showSignedOut();
  showToast('로그아웃되었습니다.');
};

checkSession();
setInterval(() => { if (currentUser) loadConversations(); }, 7000);
setInterval(() => { if (currentUser && activeConversationId && document.visibilityState === 'visible') loadMessages(); }, 3500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && currentUser) { loadConversations(); if (activeConversationId) loadMessages(true); } });
</script>
</body>
</html>
